<script>
// ===== 立水瓶物理核心（纯函数，无 DOM） =====
const PHY = (() => {
  const G = 9.81;
  const H = 0.20;          // 瓶高 m
  const R = 0.030;         // 半径 m（2D 中半宽）
  const MB = 0.025;        // 空瓶质量 kg
  const RHO = 1000;
  const AREA = Math.PI * R * R;
  const VOL = AREA * H;    // ≈ 565 mL
  const SMAX = 0.8;        // 水最多有多少比例能被“甩”到瓶口端
  const CSPREAD = 45;      // 再分布速率常数：ds/dt = (SMAX - s)·ω²/C
  const CAP_Y = 0.42;      // 出手时瓶盖高度
  const THETA0 = -0.35;    // 出手时瓶身后仰角（rad）
  const WATER_DAMP = 0.75;
  const KAPPA = 0.3;
  const E_SHELL = 0.5;     // 空瓶壳撞击恢复系数
  const V_BOUNCE_MAX = 0.55;       // 水段动量传递给瓶体刚体转动的比例 // 摇摆碰撞中水晃动额外耗散（按含水比例插值）

  // 水沿瓶轴分成两段：底部段 + 甩到瓶口的顶部段
  function config(f, s) {
    const mw = RHO * VOL * f;
    const parts = [];
    parts.push({ m: MB, z: H / 2, Io: MB * (H * H / 12 + R * R / 2) });
    if (mw > 0) {
      const m1 = mw * (1 - s / 2), m2 = mw * s / 2;
      const L1 = f * H * (1 - s / 2), L2 = f * H * s / 2;
      parts.push({ m: m1, z: L1 / 2, Io: m1 * (L1 * L1 / 12 + R * R / 4) });
      if (m2 > 0) parts.push({ m: m2, z: H - L2 / 2, Io: m2 * (L2 * L2 / 12 + R * R / 4) });
    }
    let M = 0, mz = 0;
    for (const p of parts) { M += p.m; mz += p.m * p.z; }
    const zc = mz / M;
    let I = 0;
    for (const p of parts) I += p.Io + p.m * (p.z - zc) ** 2;
    return { M, zc, I, mw, parts };
  }

  const axis = th => [-Math.sin(th), Math.cos(th)];   // 瓶底→瓶盖
  const norm = th => [Math.cos(th), Math.sin(th)];    // 横向

  function corners(cx, cy, th, zc) {
    const u = axis(th), n = norm(th);
    const bx = cx - zc * u[0], by = cy - zc * u[1];
    const tx = bx + H * u[0], ty = by + H * u[1];
    return [
      { x: bx - R * n[0], y: by - R * n[1], end: 'bottom', side: -1 },
      { x: bx + R * n[0], y: by + R * n[1], end: 'bottom', side: 1 },
      { x: tx - R * n[0], y: ty - R * n[1], end: 'top', side: -1 },
      { x: tx + R * n[0], y: ty + R * n[1], end: 'top', side: 1 },
    ];
  }

  function launch(p) {
    return { vx: 0.12 + 0.30 * p, vy: 1.8+2.0*p, w: 13+26*p };
  }

  const wrap = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };

  // 主模拟。record=true 时返回逐帧数据用于播放
  function simulate(p, f, record) {
    const dt = 0.0004;
    const L0 = launch(p);
    let s = 0;
    let c = config(f, s);
    const L = c.I * L0.w;                    // 角动量守恒量（关于质心）
    let th = THETA0;
    const u0 = axis(th);
    let cx = 0 - (H - c.zc) * u0[0], cy = CAP_Y - (H - c.zc) * u0[1];
    let vx = L0.vx, vy = L0.vy;
    let t = 0, w = L0.w;
    const frames = [], series = [];
    const recEvery = 10; let k = 0;
    // ---------- 飞行段 ----------
    while (t < 3) {
      const ds = (SMAX - s) * w * w / CSPREAD;
      const sNew = Math.min(SMAX, s + ds * dt);
      // 质心沿轴相对瓶身移动，但世界系质心轨迹不变（内力）
      s = sNew;
      c = config(f, s);
      w = L / c.I;
      th += w * dt;
      vy -= G * dt;
      cx += vx * dt; cy += vy * dt;
      t += dt;
      if (record && (k++ % recEvery === 0)) {
        frames.push({ t, cx, cy, th, zc: c.zc, s, phase: 'fly' });
        series.push({ t, w, I: c.I, s });
      }
      if (vy < 0) {
        const cs = corners(cx, cy, th, c.zc);
        let low = cs[0];
        for (const q of cs) if (q.y < low.y) low = q;
        if (low.y <= 0) { return land({ cx, cy, vx, vy, th, w, c, low, t, f, frames, series, record, s }); }
      }
    }
    return { ok: false, reason: '超时', frames, series };
  }

  function land(st) {
    const { cx, cy, vx, vy, th, w, c, low, t, f, frames, series, record } = st;
    const thm = wrap(th);
    const impact = { theta: thm, w, vx, vy, t };
    if (low.end === 'top') {
      return finishTumble(st, thm, low, Math.abs(thm) > 2.2 ? '瓶盖先着地' : '侧身着地', impact);
    }
    // 底角着地：关于接触点 P 的角动量守恒（完全非弹性碰撞）
    const sig = thm >= 0 ? 1 : -1;            // +1：左底角为支点
    const Px = low.x;
    const rx = cx - Px, ry = cy - low.y;
    // 逐段求关于 P 的角动量；水段撞击瓶底时大部分动量在内部耗散（κ）
    const u = axis(th);
    const room = Math.max(0, Math.min(1, (1 - f) / 0.5)); // 剩余空间：满瓶时水无法晃动
    const kap = 1 - (1 - KAPPA) * room;
    let LP = 0;
    c.parts.forEach((pt, i) => {
      const dz = pt.z - c.zc;
      const qx = rx + dz * u[0], qy = ry + dz * u[1];
      const pvx = vx - w * dz * u[1], pvy = vy + w * dz * u[0];
      const Li = pt.Io * w + pt.m * (qx * pvy - qy * pvx);
      LP += i === 0 ? Li : kap * Li;
    });
    const c0 = config(f, 0);                  // 水迅速塌回瓶底
    const h = c0.zc, b = R;
    const d = Math.hypot(h, b), alpha = Math.atan(b / h);
    const IP = c0.I + c0.M * d * d;
    const wP = LP / IP;
    // 竖直反弹：只有瓶壳回弹，水吸收自己的动量
    const vBounce = E_SHELL * Math.abs(vy) * (MB + c0.mw * (1 - room)) / c0.M;
    if (vBounce > V_BOUNCE_MAX) {
      return finishTumble(st, thm, low, '瓶底弹起，翻倒', { ...impact, vBounce });
    }
    let phi = Math.abs(thm), dphi = sig * wP;
    let sg = sig, px = Px;
    const housner = 1 - 2 * c0.M * b * b / IP;
    const wfrac = c0.mw / c0.M;
    const restit = housner * (1 - (1 - WATER_DAMP) * wfrac * room);
    const k1 = c0.M * G * d / IP;
    const dt = 0.0004;
    let tt = 0, kk = 0, maxPhi = phi, bounces = 0;
    let result = null;
    const pose = () => {
      const a = sg * phi, n = norm(a), u = axis(a);
      const bx = px + sg * b * n[0], by = sg * b * n[1];
      return { cx: bx + h * u[0], cy: by + h * u[1], th: a, zc: h };
    };
    while (tt < 4) {
      dphi += k1 * Math.sin(phi - alpha) * dt;
      phi += dphi * dt;
      tt += dt;
      if (phi <= 0 && dphi < 0) {
        bounces++;
        const v = -dphi * restit;
        const bxW = px + sg * b;
        sg = -sg; px = bxW - sg * b;
        phi = 0; dphi = v;
        if (v < 0.05) { result = 'stand'; }
      }
      if (phi > maxPhi) maxPhi = phi;
      if (phi >= Math.PI / 2) { phi = Math.PI / 2; result = 'fall'; }
      if (record && (kk++ % 10 === 0)) {
        const ps = pose();
        frames.push({ t: t + tt, ...ps, s: Math.max(0, st.s * (1 - tt / 0.12)), phase: 'rock' });
      }
      if (result) break;
    }
    if (!result) result = phi < alpha ? 'stand' : 'fall';
    if (record) {
      const ps = pose();
      frames.push({ t: t + tt, ...ps, s: 0, phase: 'rest' });
    }
    return {
      ok: result === 'stand',
      reason: result === 'stand' ? (bounces > 1 ? '晃了几下，立住了' : '稳稳立住') : (Math.abs(thm) < 0.15 ? '落得太猛，晃倒了' : thm < 0 ? '转得不够，倒下' : '转过头，倒下'),
      impact: { ...impact, wPivot: wP, alpha, maxPhi, restit },
      frames, series,
    };
  }

  // 瓶盖或侧身先着地：绕接触角倒向最近的侧躺姿态（仅视觉）
  function finishTumble(st, thm, low, reason, impact) {
    const { frames, series, record, t, c } = st;
    if (record) {
      const target = thm >= 0 ? Math.PI / 2 : -Math.PI / 2;
      const start = st.th - thm + thm; // 当前角
      const base = st.th - thm;
      const dur = 0.4;
      // 以接触点为支点旋转
      const rx = st.cx - low.x, ry = st.cy - low.y;
      for (let i = 1; i <= 40; i++) {
        const e = i / 40;
        const ease = 1 - Math.pow(1 - e, 3);
        const a = thm + (target - thm) * ease;
        const da = a - thm;
        const cs = Math.cos(da), sn = Math.sin(da);
        let nx = low.x + rx * cs - ry * sn, ny = low.y + rx * sn + ry * cs;
        frames.push({ t: t + e * dur, cx: nx, cy: ny, th: base + a, zc: c.zc, s: st.s * (1 - e), phase: 'tumble' });
      }
      // 落平：让最低点贴地
      const last = frames[frames.length - 1];
      const cs2 = corners(last.cx, last.cy, last.th, last.zc);
      const mn = Math.min(...cs2.map(q => q.y));
      for (let i = frames.length - 40; i < frames.length; i++) {
        const e = (i - (frames.length - 40) + 1) / 40;
        frames[i].cy -= mn * e;
      }
    }
    return { ok: false, reason, impact, frames, series };
  }

  return { simulate, config, launch, corners, axis, norm, H, R, MB, VOL, THETA0, CAP_Y, G, SMAX, CSPREAD, wrap };
})();


</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const stage = $('stage');
  const H = PHY.H, R = PHY.R;
  let C = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['paper','panel','grid','line','ink','muted','water','water-2','accent','ok','bad','desk','desk-edge','glass','label','skin']) C[k] = cs.getPropertyValue('--' + k).trim();
  }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  const store = {
    get(k, d) { try { const v = localStorage.getItem('flipmini:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('flipmini:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // 只出“有解”的水位：预先扫一遍每个水位的成功力度区间宽度
  const POOL = [];
  for (let f = 0.1; f <= 0.701; f += 0.05) {
    let n = 0;
    for (let i = 0; i < 100; i++) if (PHY.simulate((i + 0.5) / 100, f, false).ok) n++;
    if (n >= 4) POOL.push({ f: Math.round(f * 100) / 100, n });
  }
  const level = n => n >= 12 ? 1 : n >= 8 ? 2 : 3;

  let target = POOL[Math.floor(Math.random() * POOL.length)];
  let fill = 0;                 // 显示中的水位（倒水动画）
  const speed = 0.7;
  let streak = 0, best = store.get('best', 0), score = 0, round = 1;
  let mode = 'idle';
  let power = 0, chargeT0 = 0, lastPower = null;
  let res = null, simT = 0, swingT = 0, doneT = 0, frameIdx = 0;
  let chargePose = null;
  const CHARGE_MS = 1700;

  // ---------- 视口 ----------
  let W = 0, Hh = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = r.width; Hh = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    // 世界范围：x ∈ [-0.32, 0.6]，y ∈ [-0.12, 1.02]
    const narrow = W < 560;
    const span = narrow ? 0.64 : 0.92;          // 手机上只看 x ∈ [-0.17, 0.47]
    scale = Math.min(W / span, Hh / 1.14);
    ox = narrow ? W / 2 - 0.15 * scale : W / 2 - 0.14 * scale;
    oy = narrow ? Hh - Math.max(0.12 * scale, 74) : Hh - 0.12 * scale - (Hh - 1.14 * scale) / 2;
  }
  const X = x => ox + x * scale, Y = y => oy - y * scale;

  // ---------- 绘制 ----------
  function bottlePath(c) {
    // 体坐标：x 横向，z 沿轴向上（画布里用 -z）
    const r = R, sh = 0.66 * H, nk = 0.86 * H, top = 0.9 * H, nr = 0.42 * R, br = 0.012;
    c.beginPath();
    c.moveTo(-r + br, 0);
    c.lineTo(r - br, 0);
    c.quadraticCurveTo(r, 0, r, -br);
    c.lineTo(r, -sh);
    c.bezierCurveTo(r, -(sh + 0.03), nr, -(nk - 0.02), nr, -nk);
    c.lineTo(nr, -top);
    c.lineTo(-nr, -top);
    c.lineTo(-nr, -nk);
    c.bezierCurveTo(-nr, -(nk - 0.02), -r, -(sh + 0.03), -r, -sh);
    c.lineTo(-r, -br);
    c.quadraticCurveTo(-r, 0, -r + br, 0);
    c.closePath();
  }
  function worldCorners(f) {
    const u = PHY.axis(f.th), n = PHY.norm(f.th);
    const bx = f.cx - f.zc * u[0], by = f.cy - f.zc * u[1];
    return [[bx - R * n[0], by - R * n[1]], [bx + R * n[0], by + R * n[1]], [bx - R * n[0] + H * 0.9 * u[0], by - R * n[1] + H * 0.9 * u[1]], [bx + R * n[0] + H * 0.9 * u[0], by + R * n[1] + H * 0.9 * u[1]]];
  }
  function areaBelow(poly, yl) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const ina = a[1] <= yl, inb = b[1] <= yl;
      if (ina) out.push(a);
      if (ina !== inb) { const t = (yl - a[1]) / (b[1] - a[1]); out.push([a[0] + t * (b[0] - a[0]), yl]); }
    }
    let A = 0;
    for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length]; A += a[0] * b[1] - b[0] * a[1]; }
    return Math.abs(A) / 2;
  }
  function waterLevel(f) {
    const cs = worldCorners(f);
    const poly = [cs[0], cs[1], cs[3], cs[2]];
    const target = fill * 2 * R * H * 0.9;
    let lo = Math.min(...poly.map(p => p[1])), hi = Math.max(...poly.map(p => p[1]));
    for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (areaBelow(poly, m) < target) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  let slosh = 0, sloshT = 0;
  function drawBottle(f, opts = {}) {
    const u = PHY.axis(f.th);
    const bx = f.cx - f.zc * u[0], by = f.cy - f.zc * u[1];
    const ghost = opts.ghost;
    ctx.save();
    ctx.translate(X(bx), Y(by));
    ctx.rotate(-f.th);
    ctx.scale(scale, scale);
    ctx.lineWidth = 1.4 / scale;
    if (ghost) {
      bottlePath(ctx);
      ctx.strokeStyle = C.muted; ctx.globalAlpha = ghost; ctx.stroke();
      ctx.restore(); return;
    }
    // 瓶身
    bottlePath(ctx);
    ctx.fillStyle = C.glass; ctx.fill();
    // 水
    ctx.save();
    bottlePath(ctx); ctx.clip();
    const s = f.s || 0;
    if (fill > 0) {
      if (s > 0.04) {
        const L1 = fill * H * 0.9 * (1 - s / 2), L2 = fill * H * 0.9 * s / 2;
        ctx.fillStyle = C.water;
        const wav = (z0, z1, dir) => {
          ctx.beginPath();
          ctx.moveTo(-R, -z0);
          for (let i = 0; i <= 12; i++) { const x = -R + i * R / 6; ctx.lineTo(x, -(z1 + dir * 0.004 * Math.sin(i * 0.9 + performance.now() / 70))); }
          ctx.lineTo(R, -z0); ctx.closePath(); ctx.fill();
        };
        wav(0, L1, 1);
        if (L2 > 0.001) wav(0.9 * H, 0.9 * H - L2 * 1.15, -1);
        // 中间飞溅水滴
        ctx.fillStyle = C['water-2'];
        for (let i = 0; i < 5; i++) {
          const z = L1 + (0.9 * H - L2 - L1) * ((i * 0.37 + performance.now() / 900) % 1);
          ctx.beginPath(); ctx.arc(Math.sin(i * 2.3) * R * 0.6, -z, 0.0025 * s, 0, 7); ctx.fill();
        }
      } else {
        // 静止：水面在世界系水平
        ctx.restore(); ctx.save();
        const yl = waterLevel(f);
        // 回到世界坐标绘制水面，再用瓶身裁剪
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(X(bx), Y(by)); ctx.rotate(-f.th); ctx.scale(scale, scale);
        bottlePath(ctx); ctx.clip();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const amp = slosh * Math.exp(-(performance.now() - sloshT) / 450) * 0.012 * scale;
        const xs = X(bx) - H * scale, xe = X(bx) + H * scale;
        ctx.beginPath();
        ctx.moveTo(xs, Hh + 10);
        for (let x = xs; x <= xe; x += 4) ctx.lineTo(x, Y(yl) + amp * Math.sin((x - X(bx)) / (R * scale) * 2 + performance.now() / 90));
        ctx.lineTo(xe, Hh + 10); ctx.closePath();
        ctx.fillStyle = C.water; ctx.fill();
      }
    }
    ctx.restore();
    // 标签纸
    ctx.save(); bottlePath(ctx); ctx.clip();
    ctx.fillStyle = C.label; ctx.globalAlpha = 0.85;
    ctx.fillRect(-R, -0.52 * H, 2 * R, 0.17 * H);
    ctx.globalAlpha = 1;
    ctx.restore();
    // 标签文字在屏幕像素空间绘制，避免极小字号
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(X(bx), Y(by)); ctx.rotate(-f.th); ctx.translate(0, -0.435 * H * scale);
    ctx.fillStyle = C.ink; ctx.font = `600 ${Math.max(7, Math.round(0.016 * scale))}px "IBM Plex Mono", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('H₂O', 0, 0);
    ctx.restore();
    // 轮廓
    bottlePath(ctx);
    ctx.strokeStyle = C.ink; ctx.stroke();
    // 高光
    ctx.beginPath(); ctx.moveTo(-R * 0.62, -0.06 * H); ctx.lineTo(-R * 0.62, -0.6 * H);
    ctx.strokeStyle = C.panel; ctx.globalAlpha = 0.6; ctx.lineWidth = 3 / scale; ctx.stroke(); ctx.globalAlpha = 1;
    // 瓶盖
    ctx.fillStyle = C.accent;
    ctx.fillRect(-0.5 * R, -H, R, 0.1 * H);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2 / scale; ctx.strokeRect(-0.5 * R, -H, R, 0.1 * H);
    // 质心标记
    if (opts.cm) {
      ctx.beginPath(); ctx.arc(0, -f.zc, 0.006, 0, 7);
      ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1 / scale; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-0.006, -f.zc); ctx.lineTo(0.006, -f.zc); ctx.moveTo(0, -f.zc - 0.006); ctx.lineTo(0, -f.zc + 0.006); ctx.stroke();
    }
    ctx.restore();
  }
  function capPos(f) {
    const u = PHY.axis(f.th);
    return [f.cx + (H - f.zc) * u[0], f.cy + (H - f.zc) * u[1]];
  }
  const rgba = (hex, a) => {
    const m = hex.replace('#', '');
    const n = parseInt(m.length === 3 ? m.replace(/./g, c => c + c) : m, 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  };
  function drawHand(x, y, open, alpha = 1) {
    // 只画手：手背在瓶盖上方，拇指和食指从两侧捏住瓶盖
    const hx = X(x), hy = Y(y), k = scale;
    const g = open ? 0.009 : 0;
    const lw = Math.max(1.2, 0.003 * k);
    const P = (dx, dy) => [hx + dx * k, hy + dy * k];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const capsule = (a, b, w) => {
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      ctx.lineWidth = w * k + 2 * lw; ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.lineWidth = w * k; ctx.strokeStyle = C.skin; ctx.stroke();
    };
    // 手腕：向上渐隐
    const w0 = P(-0.017, -0.105), w1 = P(0.017, -0.05);
    const grad = ctx.createLinearGradient(0, w0[1], 0, w1[1]);
    grad.addColorStop(0, rgba(C.skin, 0)); grad.addColorStop(0.6, rgba(C.skin, 1));
    ctx.fillStyle = grad; ctx.fillRect(w0[0], w0[1], w1[0] - w0[0], w1[1] - w0[1]);
    const lg = ctx.createLinearGradient(0, w0[1], 0, w1[1]);
    lg.addColorStop(0, rgba(C.ink, 0)); lg.addColorStop(0.6, rgba(C.ink, 1));
    ctx.strokeStyle = lg; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(w0[0], w0[1]); ctx.lineTo(w0[0], w1[1]); ctx.moveTo(w1[0], w0[1]); ctx.lineTo(w1[0], w1[1]); ctx.stroke();
    // 食指（在手背后面，从右侧勾住瓶盖）
    capsule(P(0.014, -0.032), P(0.0195 + g, 0.011), 0.0105);
    // 手背
    const x0 = hx - 0.025 * k, y0 = hy - 0.064 * k, ww = 0.05 * k, hh = 0.042 * k, r = 0.014 * k;
    ctx.beginPath(); ctx.roundRect(x0, y0, ww, hh, r);
    ctx.fillStyle = C.skin; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.stroke();
    // 指节褶线
    ctx.globalAlpha = alpha * 0.5; ctx.lineWidth = lw * 0.8;
    ctx.beginPath(); ctx.moveTo(hx + 0.002 * k, hy - 0.029 * k); ctx.quadraticCurveTo(hx + 0.012 * k, hy - 0.025 * k, hx + 0.02 * k, hy - 0.031 * k); ctx.stroke();
    ctx.globalAlpha = alpha;
    // 拇指（在前面，从左侧压住瓶盖）
    capsule(P(-0.016, -0.036), P(-0.0195 - g, 0.011), 0.0115);
    ctx.restore();
  }
  function drawDesk() {
    const y0 = Y(0);
    ctx.fillStyle = C.desk; ctx.fillRect(0, y0, W, Hh - y0);
    ctx.fillStyle = C['desk-edge']; ctx.fillRect(0, y0, W, Math.max(3, 0.012 * scale));
    // 刻度尺：10 cm 一格
    ctx.strokeStyle = C['desk-edge']; ctx.fillStyle = C['desk-edge'];
    ctx.font = '10px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.lineWidth = 1;
    for (let x = -0.3; x <= 0.61; x += 0.05) {
      const xx = Math.round(X(x)) + 0.5, big = Math.abs(Math.round(x * 100) % 10) === 0;
      if (xx < 4 || xx > W - 34) continue;
      ctx.beginPath(); ctx.moveTo(xx, y0 + 6); ctx.lineTo(xx, y0 + (big ? 14 : 10)); ctx.stroke();
    }

  }
  function drawGauge() {
    const gw = 10, gx = W - gw - (W < 560 ? 18 : 32), gy = Y(0.45), gh = 0.28 * scale;
    ctx.fillStyle = C.paper; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    ctx.fillRect(gx, gy - gh, gw, gh); ctx.strokeRect(gx + 0.5, gy - gh + 0.5, gw - 1, gh - 1);
    const p = mode === 'charge' ? power : (mode === 'idle' ? 0 : power);
    ctx.fillStyle = C.accent; ctx.fillRect(gx + 1, gy - gh * p, gw - 2, gh * p);
    if (lastPower != null) {
      const ly = gy - gh * lastPower;
      ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.moveTo(gx - 5, ly); ctx.lineTo(gx + gw + 5, ly); ctx.stroke();
      ctx.fillStyle = C.muted; ctx.font = '10px "IBM Plex Mono", monospace'; ctx.textAlign = 'left';
      ctx.textAlign = 'right'; ctx.fillText('上次', gx - 7, ly + 3);
    }
    ctx.fillStyle = C.ink; ctx.font = '600 12px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
    ctx.fillText((p * 100).toFixed(0), gx + gw / 2, gy + 16);
    ctx.fillStyle = C.muted; ctx.font = '10px "IBM Plex Mono", monospace';
    ctx.fillText('力度', gx + gw / 2, gy - gh - 8);
  }
  function idlePose(p) {
    const c = PHY.config(fill, 0);
    const th = -0.1 * p * Math.sin(performance.now() / 60) * 0 - 0.12 * p;
    const capx = -0.015 * p, capy = PHY.CAP_Y - 0.06 * p;
    const u = PHY.axis(th);
    return { cx: capx - (H - c.zc) * u[0], cy: capy - (H - c.zc) * u[1], th, zc: c.zc, s: 0 };
  }
  function lerpFrame(a, b, t) {
    const k = Math.max(0, Math.min(1, (t - a.t) / Math.max(1e-9, b.t - a.t)));
    let dth = b.th - a.th;
    if (dth > Math.PI) dth -= 2 * Math.PI; if (dth < -Math.PI) dth += 2 * Math.PI;
    return { t, cx: a.cx + (b.cx - a.cx) * k, cy: a.cy + (b.cy - a.cy) * k, th: a.th + dth * k, zc: a.zc + (b.zc - a.zc) * k, s: a.s + (b.s - a.s) * k, phase: b.phase };
  }
  function frameAt(t) {
    const fr = res.frames;
    if (t <= fr[0].t) return fr[0];
    while (frameIdx < fr.length - 2 && fr[frameIdx + 1].t < t) frameIdx++;
    if (frameIdx >= fr.length - 1) return fr[fr.length - 1];
    return lerpFrame(fr[frameIdx], fr[frameIdx + 1], t);
  }

  let banner = null;
  function render(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, Hh);
    drawDesk();
    drawGauge();
    let f, hand = null, open = false;
    if (mode === 'idle' || mode === 'charge') {
      f = idlePose(mode === 'charge' ? power : 0);
      hand = capPos(f);
    } else if (mode === 'swing') {
      const k = Math.min(1, swingT / 0.12), e = k * k * (3 - 2 * k);
      const a = chargePose, b = res.frames[0];
      const ca = capPos(a), cb = capPos(b);
      const th = a.th + (b.th - a.th) * e;
      const capx = ca[0] + (cb[0] - ca[0]) * e, capy = ca[1] + (cb[1] - ca[1]) * e;
      const u = PHY.axis(th);
      f = { th, zc: b.zc, s: 0, cx: capx - (H - b.zc) * u[0], cy: capy - (H - b.zc) * u[1] };
      hand = [capx, capy];
    } else {
      // 残影
      const fr = res.frames;
      let lastGhost = -1;
      for (let i = 0; i < fr.length && fr[i].t <= simT; i++) {
        if (fr[i].phase !== 'fly') break;
        if (fr[i].t - lastGhost >= 0.05) { lastGhost = fr[i].t; drawBottle(fr[i], { ghost: 0.16 }); }
      }
      f = frameAt(simT);
      const c0 = res.frames[0], cp = capPos(c0);
      const ht = Math.min(1, simT / 0.25);
      hand = [cp[0] - 0.04 * ht, cp[1] + 0.05 * Math.sin(ht * Math.PI) ];
      open = true;
    }
    drawBottle(f);
    const handA = (mode === 'play' || mode === 'done') ? Math.max(0, 1 - simT / 0.35) : 1;
    if (hand && handA > 0) drawHand(hand[0], hand[1], open, handA);
    if (banner) {
      const age = (now - banner.t0) / 1000;
      ctx.globalAlpha = Math.min(1, age * 5);
      ctx.textAlign = 'center';
      ctx.font = `900 ${Math.round(Math.min(44, W / 11))}px "Noto Serif SC", serif`;
      ctx.fillStyle = banner.ok ? C.ok : C.bad;
      ctx.fillText(banner.title, W / 2, Hh * 0.2 + 30);
      ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = C.muted;
      ctx.fillText(banner.sub, W / 2, Hh * 0.2 + 58);
      if (mode === 'done' && now - banner.t0 > 700) { ctx.fillStyle = C.ink; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(now / 250); ctx.font = '600 13px system-ui, sans-serif'; ctx.fillText('点一下进入下一回合', W / 2, Hh * 0.2 + 88); }
      ctx.globalAlpha = 1;
    }
  }

  let lastNow = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
    if (mode === 'idle' || mode === 'charge') fill += (target.f - fill) * Math.min(1, dt * 6);
    if (mode === 'charge') power = Math.min(1, (now - chargeT0) / CHARGE_MS);
    else if (mode === 'swing') { swingT += dt; if (swingT >= 0.12) { mode = 'play'; simT = 0; frameIdx = 0; } }
    else if (mode === 'play') {
      const prev = simT;
      simT += dt * speed;
      const imp = res.impact ? res.impact.t : Infinity;
      if (prev < imp && simT >= imp) { slosh = 1; sloshT = now; }
      if (simT >= res.frames[res.frames.length - 1].t + 0.05) { mode = 'done'; doneT = now; finish(); }
    }
    render(now);
    requestAnimationFrame(tick);
  }

  function showRound() {
    $('round').textContent = `第 ${round} 回合`;
    $('lv').textContent = Math.round(target.f * 100) + '%';
    const d = level(target.n);
    $('dots').textContent = '●'.repeat(d) + '○'.repeat(3 - d);
    $('dots').title = ['简单', '普通', '困难'][d - 1];
    const b = $('badge'); b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 250);
  }
  function nextRound() {
    let n = target;
    if (POOL.length > 1) while (n === target) n = POOL[Math.floor(Math.random() * POOL.length)];
    target = n; round++; mode = 'idle'; banner = null; res = null;
    showRound();
  }
  function startCharge() {
    if (mode === 'done') { nextRound(); return; }
    if (mode !== 'idle') return;
    mode = 'charge'; power = 0; chargeT0 = performance.now();
  }
  function release() {
    if (mode !== 'charge') return;
    fill = target.f;
    chargePose = idlePose(power);
    res = PHY.simulate(power, target.f, true);
    lastPower = power;
    mode = 'swing'; swingT = 0; slosh = 0;
  }
  function finish() {
    if (res.ok) { score++; streak++; if (streak > best) { best = streak; store.set('best', best); } }
    else streak = 0;
    const cheers = ['立住了！', '稳！', '漂亮！', '手感来了！'];
    banner = { ok: res.ok, title: res.ok ? (streak > 1 ? `${streak} 连胜！` : cheers[Math.floor(Math.random() * cheers.length)]) : '没立住', sub: res.reason, t0: performance.now() };
    $('sScore').textContent = score; $('sStreak').textContent = streak; $('sBest').textContent = best;
  }

  stage.addEventListener('pointerdown', e => { e.preventDefault(); stage.setPointerCapture?.(e.pointerId); startCharge(); });
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startCharge(); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); release(); } });

  window.addEventListener('resize', resize);
  resize();
  $('sBest').textContent = best;
  showRound();
  requestAnimationFrame(tick);
})();
</script>
